datasets:
  manuscripts:
    type: file
    path: "{{ input_path }}"

default_model: "openai/llama-4-scout"  # DocETL uses litellm; openai-compat via base_url

operations:
  - name: extract_biological
    type: map
    # Jinja2 template — 'text' is the key our runner writes to each document
    prompt: |
      You are a scientific metadata extraction agent. Extract ONLY values EXPLICITLY stated in the text.

      FIELDS TO EXTRACT:
      - species: Scientific organism name (e.g., Homo sapiens, Mus musculus, E. coli)
      - tissue: Tissue type (e.g., liver, brain, blood, tumor)
      - cell_type: Cell type (e.g., T cells, hepatocytes, neurons)
      - disease_state: Disease name if mentioned
      - sample_source: Sample origin description
      - age: Numerical age or age range
      - anatomic_site_tumor: Tumor anatomical location
      - BMI: Body mass index
      - cell_line: Cell line name (e.g., HeLa, HEK293, MCF7)
      - sex: Biological sex
      - strain: Organism strain name

      For EACH field output a 2-element list: [extracted_value, evidence_sentence].
      - Copy values EXACTLY as written (keep abbreviations: "P. falciparum" not "Plasmodium falciparum")
      - If not explicitly stated → ["unknown", ""]
      - VERBATIM values: the evidence sentence MUST contain the exact extracted value as a substring.
      - INFERRED values (e.g., species from "patient", disease from cell line): prefix evidence with
        "inferred: " followed by the verbatim quote that supports the inference.
        Example: ["Homo sapiens", "inferred: patient samples were collected from donors"]

      SPECIES INFERENCE RULES:
      - If the text mentions "human", "patient", "donor", "clinical samples", "biopsy" → species = "Homo sapiens"
      - If a well-known HUMAN cell line is mentioned (HeLa, HEK293, MCF-7, A549, Jurkat, K562...) → species = "Homo sapiens"
      - If a well-known MOUSE cell line is mentioned (NIH3T3, MEF, RAW264.7) → species = "Mus musculus"
      - If "mice" or "mouse" → "Mus musculus". If "rat" → "Rattus norvegicus". If "yeast" → "Saccharomyces cerevisiae"
      - NEVER put a cell line name in the species field.

      TISSUE INFERENCE RULES:
      - HeLa → "cervix", HEK293 → "kidney", MCF-7 → "breast", A549 → "lung", Jurkat → "blood"
      - If a cancer type names an organ ("gastric cancer", "lung adenocarcinoma") → infer tissue as that organ

      DISEASE INFERENCE RULES:
      - Healthy/control/normal samples with NO disease → disease_state = "normal"
      - HeLa → "cervical adenocarcinoma", MCF-7 → "breast carcinoma", A549 → "lung adenocarcinoma"
      - K562 → "chronic myeloid leukemia", Jurkat → "T-cell lymphoma"

      CELL TYPE RULES:
      - Extract the BIOLOGICAL cell type, not the cell line name.
      - MCF-7 → "epithelial cell", Jurkat → "T cell", K562 → "myeloid cell", HepG2 → "hepatocyte"

      SAMPLE SOURCE RULES:
      - Must describe BIOLOGICAL origin: "healthy donors", "tumor biopsy", "cell culture", "patient serum"
      - NEVER extract institutional names or supplier names as sample source.

      TEXT:
      {{ input.text }}

      Return a JSON object with ALL fields present.
    output:
      schema:
        species: "list[str]"
        tissue: "list[str]"
        cell_type: "list[str]"
        disease_state: "list[str]"
        sample_source: "list[str]"
        age: "list[str]"
        anatomic_site_tumor: "list[str]"
        BMI: "list[str]"
        cell_line: "list[str]"
        sex: "list[str]"
        strain: "list[str]"
    # Validate the 2-element [value, evidence] structure for key fields
    validate:
      - "len(output['species']) == 2"
      - "len(output['tissue']) == 2"
      - "len(output['cell_type']) == 2"
      - "len(output['disease_state']) == 2"
    num_retries_on_validate_failure: 2
    gleaning:
      num_rounds: 2
      # Only glean when at least one field was actually extracted (not all unknowns)
      if: "any(isinstance(v, list) and len(v) == 2 and v[0] != 'unknown' for v in output.values())"
      validation_prompt: |
        You just extracted biological metadata. Review your extraction:
        {{ output }}

        For EACH field with a non-unknown value, check against the paper text you saw:
        1. Evidence starting with "inferred: ": is the quoted text a VERBATIM quote that reasonably
           supports the inferred value? (e.g., "inferred: patient samples" → species "Homo sapiens" ✓)
        2. Evidence NOT starting with "inferred: ": does it contain the extracted value as a SUBSTRING?
           (The evidence must be a verbatim quote from the paper.)
        3. For any "unknown" value: is the evidence empty ""?
        4. For non-unknown values with NO verbatim support: add the "inferred: " prefix.

        List each failing field and the specific issue. If ALL fields pass, say "VALID".

pipeline:
  steps:
    - name: biological_extraction
      input: manuscripts
      operations:
        - extract_biological
  output:
    type: file
    path: "{{ output_path }}"
