# Llama 4 Scout via Jetstream
llm:
  provider: "openai"
  model: "llama-4-scout"
  base_url: "https://llm.jetstream-cloud.org/llama-4-scout/v1/"
  api_key_env_var: "LLM_API_KEY"

paths:
  input_dir: "./docs"
  output_dir: "./framework_output"
  ontology_dir: "ontologies"
  cache_dir: "ontology_cache"

agents:
  temperatures: [0.0]
  validate: true

concurrency:
  max_workers: 8
  request_timeout: 120

reproducibility:
  seed: 42
  log_info: true
