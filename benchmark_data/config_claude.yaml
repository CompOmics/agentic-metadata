# Claude Opus 4.5 Benchmark Configuration
llm:
  provider: "anthropic"
  model: "claude-opus-4-5"
  api_key_env_var: "ANTHROPIC_API_KEY"

paths:
  input_dir: "./docs"
  output_dir: "./framework_output"
  ontology_dir: "ontologies"
  cache_dir: "ontology_cache"

agents:
  temperatures: [0.0]
  validate: true

concurrency:
  max_workers: 8
  request_timeout: 120

reproducibility:
  seed: 42
  log_info: true
