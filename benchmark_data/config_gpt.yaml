# GPT Benchmark Configuration via OpenRouter
llm:
  provider: "openrouter"
  base_url: "https://openrouter.ai/api/v1"
  model: "openai/gpt-5.4"
  api_key_env_var: "OPENROUTER_API_KEY"

paths:
  input_dir: "./docs"
  output_dir: "./framework_output"
  ontology_dir: "ontologies"
  cache_dir: "ontology_cache"

agents:
  temperatures: [0.0]
  validate: true

concurrency:
  max_workers: 1
  request_timeout: 120

reproducibility:
  seed: 42
  log_info: true
