# Docker-specific OpenRouter LLM configuration.

llm:
  base_url: "https://openrouter.ai/api/v1"
  model: "google/gemma-4-31b-it"
  api_key_env_var: "OPENROUTER_API_KEY"

paths:
  input_dir: "./input"
  output_dir: "./framework_output"
  ontology_dir: "ontologies"
  cache_dir: "ontology_cache"

normalization:
  backend: "faiss"
  use_gpu: true
  use_quantization: true
  similarity_threshold: 0.7
  top_k: 5

agents:
  temperatures: [0.0]
  validate: true
  max_retries: 1
  confidence_threshold: 0.6

concurrency:
  max_workers: 2
  request_timeout: 300

reproducibility:
  seed: 42
  log_info: true
